name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps
        run: npm install
      - name: Prepare web + android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npx cap add android
          npx cap sync android
      - name: Add native plugin and permissions
        run: |
          JAVA_DIR=android/app/src/main/java/com/apkcheck/app
          mkdir -p $JAVA_DIR
          cat > $JAVA_DIR/MainActivity.java <<'JEOF'
          package com.apkcheck.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkCheckPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JEOF
          cat > $JAVA_DIR/ApkCheckPlugin.java <<'JEOF'
          package com.apkcheck.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInfo;
          import android.content.pm.PackageManager;
          import android.content.pm.PermissionInfo;
          import android.content.pm.ProviderInfo;
          import android.content.pm.Signature;
          import android.content.pm.SigningInfo;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.Settings;
          import androidx.activity.result.ActivityResult;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.security.MessageDigest;
          import java.util.HashSet;
          import java.util.Set;

          @CapacitorPlugin(name = "ApkCheck")
          public class ApkCheckPlugin extends Plugin {

              @PluginMethod
              public void pick(PluginCall call) {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  startActivityForResult(call, i, "pickDone");
              }

              @ActivityCallback
              private void pickDone(PluginCall call, ActivityResult r) {
                  if (call == null) return;
                  if (r.getResultCode() != Activity.RESULT_OK || r.getData() == null || r.getData().getData() == null) {
                      call.reject("cancel");
                      return;
                  }
                  final Uri uri = r.getData().getData();
                  new Thread(() -> {
                      try {
                          File dir = new File(getContext().getCacheDir(), "apk");
                          dir.mkdirs();
                          File f = new File(dir, "pick.apk");
                          try (InputStream in = getContext().getContentResolver().openInputStream(uri);
                               OutputStream out = new FileOutputStream(f)) {
                              byte[] b = new byte[65536];
                              int n;
                              while ((n = in.read(b)) > 0) out.write(b, 0, n);
                          }
                          call.resolve(analyze(f));
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  }).start();
              }

              @PluginMethod
              public void check(PluginCall call) {
                  final String path = call.getString("path");
                  new Thread(() -> {
                      try {
                          call.resolve(analyze(new File(path)));
                      } catch (Exception e) {
                          call.reject(String.valueOf(e.getMessage()));
                      }
                  }).start();
              }

              @PluginMethod
              public void install(PluginCall call) {
                  Context c = getContext();
                  if (Build.VERSION.SDK_INT >= 26 && !c.getPackageManager().canRequestPackageInstalls()) {
                      Intent s = new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:" + c.getPackageName()));
                      s.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(s);
                      call.reject("need_permission");
                      return;
                  }
                  Uri u = FileProvider.getUriForFile(c, c.getPackageName() + ".fileprovider", new File(call.getString("path")));
                  Intent i = new Intent(Intent.ACTION_VIEW);
                  i.setDataAndType(u, "application/vnd.android.package-archive");
                  i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                  c.startActivity(i);
                  call.resolve();
              }

              @PluginMethod
              public void uninstall(PluginCall call) {
                  Intent i = new Intent(Intent.ACTION_DELETE, Uri.parse("package:" + call.getString("pkg")));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  getContext().startActivity(i);
                  call.resolve();
              }

              private Set<String> sigs(PackageInfo p) {
                  Set<String> out = new HashSet<>();
                  try {
                      Signature[] a = null, b = null;
                      if (Build.VERSION.SDK_INT >= 28) {
                          SigningInfo si = p.signingInfo;
                          if (si != null) {
                              a = si.getApkContentsSigners();
                              if (!si.hasMultipleSigners()) b = si.getSigningCertificateHistory();
                          }
                      } else {
                          a = p.signatures;
                      }
                      for (Signature[] arr : new Signature[][]{a, b}) {
                          if (arr == null) continue;
                          for (Signature s : arr) {
                              byte[] d = MessageDigest.getInstance("SHA-256").digest(s.toByteArray());
                              StringBuilder sb = new StringBuilder();
                              for (byte x : d) sb.append(String.format("%02x", x));
                              out.add(sb.toString());
                          }
                      }
                  } catch (Exception ignored) {}
                  return out;
              }

              private String shortSig(Set<String> s) {
                  if (s.isEmpty()) return "?";
                  return s.iterator().next().substring(0, 12);
              }

              private JSObject conflict(String type, String pkg, String label, String detail) {
                  JSObject o = new JSObject();
                  o.put("type", type);
                  o.put("pkg", pkg);
                  o.put("label", label);
                  o.put("detail", detail);
                  return o;
              }

              private JSObject decorate(PackageManager pm, PackageInfo ip, JSObject c) {
              try {
                  c.put("versionName", ip.versionName);
                  c.put("installedAt", ip.firstInstallTime);
                  c.put("system", (ip.applicationInfo.flags & android.content.pm.ApplicationInfo.FLAG_SYSTEM) != 0);
                  c.put("enabled", ip.applicationInfo.enabled);
                  Intent li = pm.getLaunchIntentForPackage(ip.packageName);
                  if (li != null && li.getComponent() != null) {
                      try {
                          c.put("launchLabel", String.valueOf(pm.getActivityInfo(li.getComponent(), 0).loadLabel(pm)));
                      } catch (Exception ignored) {}
                  }
                  String inst = null;
                  try {
                      inst = Build.VERSION.SDK_INT >= 30
                              ? pm.getInstallSourceInfo(ip.packageName).getInstallingPackageName()
                              : pm.getInstallerPackageName(ip.packageName);
                  } catch (Exception ignored) {}
                  if (inst != null) {
                      c.put("installer", inst);
                      try {
                          c.put("installerLabel", String.valueOf(pm.getApplicationLabel(pm.getApplicationInfo(inst, 0))));
                      } catch (Exception ignored) {}
                  }
              } catch (Exception ignored) {}
              return c;
          }

          @PluginMethod
          public void settings(PluginCall call) {
              Intent i = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS, Uri.parse("package:" + call.getString("pkg")));
              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              getContext().startActivity(i);
              call.resolve();
          }

          private JSObject analyze(File f) throws Exception {
                  PackageManager pm = getContext().getPackageManager();
                  int sigFlag = Build.VERSION.SDK_INT >= 28 ? PackageManager.GET_SIGNING_CERTIFICATES : PackageManager.GET_SIGNATURES;
                  PackageInfo ap = pm.getPackageArchiveInfo(f.getAbsolutePath(),
                          PackageManager.GET_PROVIDERS | PackageManager.GET_PERMISSIONS | sigFlag);
                  if (ap == null) throw new Exception("Не удалось прочитать APK. Файл повреждён или это не APK.");
                  ap.applicationInfo.sourceDir = f.getAbsolutePath();
                  ap.applicationInfo.publicSourceDir = f.getAbsolutePath();
                  long newCode = Build.VERSION.SDK_INT >= 28 ? ap.getLongVersionCode() : ap.versionCode;
                  Set<String> newSigs = sigs(ap);

                  JSObject o = new JSObject();
                  o.put("path", f.getAbsolutePath());
                  o.put("pkg", ap.packageName);
                  o.put("label", String.valueOf(pm.getApplicationLabel(ap.applicationInfo)));
                  o.put("versionName", ap.versionName);
                  o.put("versionCode", newCode);
                  o.put("sig", shortSig(newSigs));

                  JSArray list = new JSArray();

                  // 1. Тот же package name уже установлен
                  try {
                      PackageInfo ip = pm.getPackageInfo(ap.packageName, sigFlag);
                      String il = String.valueOf(pm.getApplicationLabel(ip.applicationInfo));
                      long oldCode = Build.VERSION.SDK_INT >= 28 ? ip.getLongVersionCode() : ip.versionCode;
                      Set<String> oldSigs = sigs(ip);
                      boolean same = false;
                      for (String s : newSigs) if (oldSigs.contains(s)) same = true;
                      JSObject inst = new JSObject();
                      inst.put("label", il);
                      inst.put("versionName", ip.versionName);
                      inst.put("versionCode", oldCode);
                      o.put("installed", inst);
                      if (!same) {
                          list.put(decorate(pm, ip, conflict("signature", ap.packageName, il,
                                  "Установлено другое приложение с таким же package name, подпись отличается (" + shortSig(oldSigs) + " ≠ " + shortSig(newSigs) + "). Обновить поверх нельзя, нужно удалить.")));
                      } else if (oldCode > newCode) {
                          list.put(decorate(pm, ip, conflict("downgrade", ap.packageName, il,
                                  "Установлена версия новее (" + ip.versionName + " > " + ap.versionName + "). Понижение версии запрещено.")));
                      }
                  } catch (PackageManager.NameNotFoundException ignored) {}

                  // 2. Совпадение authorities провайдеров и объявленных permission с другими приложениями
                  Set<String> newAuth = new HashSet<>();
                  if (ap.providers != null)
                      for (ProviderInfo pi : ap.providers)
                          if (pi.authority != null) for (String a : pi.authority.split(";")) newAuth.add(a);
                  Set<String> newPerm = new HashSet<>();
                  if (ap.permissions != null)
                      for (PermissionInfo pi : ap.permissions) newPerm.add(pi.name);

                  for (PackageInfo base : pm.getInstalledPackages(0)) {
                      String pkg = base.packageName;
                      if (pkg.equals(ap.packageName)) continue;
                      try {
                          PackageInfo p = pm.getPackageInfo(pkg, PackageManager.GET_PROVIDERS | PackageManager.GET_PERMISSIONS);
                          String lbl = String.valueOf(pm.getApplicationLabel(p.applicationInfo));
                          if (p.providers != null) {
                              for (ProviderInfo pi : p.providers) {
                                  if (pi.authority == null) continue;
                                  for (String a : pi.authority.split(";")) {
                                      if (newAuth.contains(a)) {
                                          list.put(conflict("provider", pkg, lbl, "Одинаковый provider authority: " + a + " (INSTALL_FAILED_CONFLICTING_PROVIDER)"));
                                          newAuth.remove(a);
                                      }
                                  }
                              }
                          }
                          if (p.permissions != null) {
                              for (PermissionInfo pi : p.permissions) {
                                  if (newPerm.contains(pi.name)) {
                                      list.put(conflict("permission", pkg, lbl, "Одинаковое объявленное разрешение: " + pi.name + " (INSTALL_FAILED_DUPLICATE_PERMISSION)"));
                                      newPerm.remove(pi.name);
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                  }
                  o.put("conflicts", list);
                  return o;
              }
          }
          JEOF
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.REQUEST_DELETE_PACKAGES" />\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />#' $M
          grep -c QUERY_ALL_PACKAGES $M
      - name: Set launcher icon
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'ic_launcher*.png' -exec cp icon.png {} \;
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: apk-check
          path: android/app/build/outputs/apk/debug/app-debug.apk
